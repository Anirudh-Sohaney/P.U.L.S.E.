services:
  backend:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      SECRET_KEY: ""
      SECRET_KEY_FILE: /run/secrets/pulse_signing_key
      PUBLIC_ORIGIN: https://${PULSE_DOMAIN:?Set PULSE_DOMAIN to the public hostname}
      CORS_ORIGINS: '[]'
      TRUSTED_PROXY_HOSTNAMES: '["caddy"]'
    secrets:
      - pulse_signing_key

  worker:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      SECRET_KEY: ""
      SECRET_KEY_FILE: /run/secrets/pulse_signing_key
      PUBLIC_ORIGIN: https://${PULSE_DOMAIN:?Set PULSE_DOMAIN to the public hostname}
      CORS_ORIGINS: '[]'
    secrets:
      - pulse_signing_key

  backup:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      SECRET_KEY: ""
      SECRET_KEY_FILE: /run/secrets/pulse_signing_key
      PUBLIC_ORIGIN: https://${PULSE_DOMAIN:?Set PULSE_DOMAIN to the public hostname}
      CORS_ORIGINS: '[]'
      PULSE_BACKUP_EXPORT_DIR: /offsite
      PULSE_BACKUP_KEY_FILE: /run/secrets/pulse_backup_key
    volumes:
      - type: bind
        source: ${PULSE_OFFSITE_BACKUP_DIR:?Set PULSE_OFFSITE_BACKUP_DIR to the separate backup mount}
        target: /offsite
        bind:
          create_host_path: false
    secrets:
      - pulse_signing_key
      - pulse_backup_key

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PULSE_DOMAIN: ${PULSE_DOMAIN:?Set PULSE_DOMAIN to the public hostname}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

secrets:
  pulse_signing_key:
    file: ./secrets/pulse_signing_key
  pulse_backup_key:
    file: ./secrets/pulse_backup_key

volumes:
  caddy_data:
  caddy_config:
