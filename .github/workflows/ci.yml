name: Production checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit locked backend runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-prod.lock --disable-pip --no-deps
      - name: Run backend and browser-model tests
        run: python -m pytest tests -q
      - name: Verify legacy model publication gate
        env:
          PYTHONPATH: ../model
        run: python -m pytest ../model/tests/test_legacy_prod_pipeline.py -q
      - name: Verify reproducible model data builders
        working-directory: .
        env:
          PYTHONPATH: model
        run: |
          python -m pytest model/tests/test_build_nadac_historical_panel.py model/tests/test_metric_feature_store.py model/tests/test_metric_audit_fixture.py -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint frontend source
        run: npm run lint
      - name: Typecheck, verify browser-model wheels, and build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PULSE_DOMAIN: pulse.example.com
      PULSE_OFFSITE_BACKUP_DIR: /tmp/pulse-ci-offsite
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the committed CMS source artifact
        run: |
          git lfs version
          git lfs pull --include="data/targeted_additions/cms_partd_geography_drug/data/arkansas_partd_geography_drug_by_year.csv.gz" --exclude=""
          python -c "from pathlib import Path; path=Path('data/targeted_additions/cms_partd_geography_drug/data/arkansas_partd_geography_drug_by_year.csv.gz'); assert path.read_bytes()[:2] == b'\x1f\x8b'"
      - name: Build and start frontend and API containers
        run: docker compose -f website/docker-compose.yml up --build -d frontend
      - name: Check container API and frontend
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/ready
          curl --fail http://127.0.0.1:3141/
          curl --fail http://127.0.0.1:3141/api/v1/signals/catalog?limit=1
          curl --fail http://127.0.0.1:3141/docs
          docker compose -f website/docker-compose.yml exec -T backend python -c "from backend.signal_store import connect; db=connect(); count=db.execute(\"SELECT COUNT(*) FROM signal_records WHERE source_kind='historical_catalog'\").fetchone()[0]; assert count==4097, count; db.close()"
      - name: Exercise in-browser training and private storage
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
          python website/scripts/browser_smoke.py --base-url http://127.0.0.1:3141 --signal-years 3 --simulate-rate-limit
      - name: Build worker image and check task imports
        run: |
          docker compose -f website/docker-compose.yml build worker
          docker compose -f website/docker-compose.yml run --rm --no-deps worker python -c "from backend.worker import REFRESH_TASKS; assert len(REFRESH_TASKS) == 14"
      - name: Publish evaluated baseline and rehearse Compose backup
        run: |
          docker compose -f website/docker-compose.yml run --rm --no-deps worker python -c "from backend.refresh_demand_baseline import refresh_demand_baseline; result=refresh_demand_baseline(); assert result['drugs'] > 0"
          docker compose -f website/docker-compose.yml exec -T backend python -m scripts.audit_signal_store
          docker compose -f website/docker-compose.yml build backup
          docker compose -f website/docker-compose.yml run --rm --no-deps backup python -m scripts.backup_databases
          docker compose -f website/docker-compose.yml run --rm --no-deps backup python -m scripts.operational_status backup
          docker compose -f website/docker-compose.yml run --rm --no-deps backup python -c "from pathlib import Path; from scripts.rehearse_restore import rehearse; snapshot=max(Path('/app/data/backups').iterdir()); result=rehearse(snapshot); assert result['catalog_signals'] >= 1312 and result['ranked_drugs'] > 0"
      - name: Validate cloud overlay and production secret startup
        run: |
          umask 077
          mkdir -p website/secrets
          python -c "import pathlib,secrets; pathlib.Path('website/secrets/pulse_signing_key').write_text(secrets.token_urlsafe(48))"
          python -c "import pathlib,secrets; pathlib.Path('website/secrets/pulse_backup_key').write_text(secrets.token_hex(32) + '\n')"
          sudo chown "$(id -u):10001" website/secrets/pulse_signing_key
          sudo chown "$(id -u):10001" website/secrets/pulse_backup_key
          chmod 640 website/secrets/pulse_signing_key website/secrets/pulse_backup_key
          mkdir -p "$PULSE_OFFSITE_BACKUP_DIR"
          chmod 700 "$PULSE_OFFSITE_BACKUP_DIR"
          sudo chown 10001:10001 "$PULSE_OFFSITE_BACKUP_DIR"
          docker compose -f website/docker-compose.yml -f website/docker-compose.cloud.yml config --quiet
          docker run --rm -e PULSE_DOMAIN -v "$PWD/website/deploy/caddy:/etc/caddy:ro" caddy:2-alpine validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose -f website/docker-compose.yml -f website/docker-compose.cloud.yml up -d backend
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/ready
          docker compose -f website/docker-compose.yml -f website/docker-compose.cloud.yml run --rm --no-deps worker python -c "from backend.config import settings; assert settings.ENVIRONMENT == 'production' and len(settings.SECRET_KEY) >= 32"
          docker compose -f website/docker-compose.yml -f website/docker-compose.cloud.yml run --rm --no-deps backup python -c "from backend.config import settings; from backend.backup_worker import backup_due; assert settings.ENVIRONMENT == 'production' and len(settings.SECRET_KEY) >= 32 and callable(backup_due)"
          docker compose -f website/docker-compose.yml -f website/docker-compose.cloud.yml run --rm --no-deps backup python -c "from pathlib import Path; from backend.backup_worker import ensure_encrypted_export; from scripts.encrypted_backup import load_key, restore_encrypted; from scripts.rehearse_restore import rehearse; source=Path('/app/data'); snapshot=max((source/'backups').iterdir()); key=Path('/run/secrets/pulse_backup_key'); bundle=ensure_encrypted_export(snapshot, source, Path('/offsite'), key); restored=Path('/tmp/pulse-offsite-restored'); restore_encrypted(bundle, restored, load_key(key)); assert rehearse(restored)['catalog_signals'] >= 1312"
          docker compose -f website/docker-compose.yml -f website/docker-compose.cloud.yml run --rm --no-deps backup python -m scripts.operational_status backup
      - name: Exercise the production Caddy routing
        run: |
          backend_id="$(docker compose -f website/docker-compose.yml -f website/docker-compose.cloud.yml ps -q backend)"
          network="$(docker inspect -f '{{range $name, $details := .NetworkSettings.Networks}}{{$name}}{{end}}' "$backend_id")"
          docker run -d --name pulse-ci-caddy --network "$network" --network-alias caddy \
            -e PULSE_DOMAIN=http://pulse.example.com \
            -v "$PWD/website/deploy/caddy:/etc/caddy:ro" \
            -p 127.0.0.1:8080:80 caddy:2-alpine
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused \
            -H 'Host: pulse.example.com' http://127.0.0.1:8080/
          curl --fail -H 'Host: pulse.example.com' \
            'http://127.0.0.1:8080/api/v1/signals/catalog?limit=1'
          curl --fail -H 'Host: pulse.example.com' http://127.0.0.1:8080/docs
      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f website/docker-compose.yml logs --tail=100
          docker logs pulse-ci-caddy 2>/dev/null || true
      - name: Stop containers
        if: always()
        run: |
          docker rm -f pulse-ci-caddy 2>/dev/null || true
          docker compose -f website/docker-compose.yml down --remove-orphans
